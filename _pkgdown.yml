authors:
  Kieran Healy:
    href: http://kieranhealy.org

url: https://kjhealy.github.io/nycosm/
template:
  bootstrap: 5
  bslib:
    base_font: {google: "IBM Plex Sans"}
    heading_font: {google: "IBM Plex Sans"}
    code_font: {google: "IBM Plex Mono"}

reference:
  - title: "OSM layers"
    desc: >
      Lazy tables of OpenStreetMap features for New York City. Map data
      © OpenStreetMap contributors, under the ODbL 1.0.
    contents:
      - nyc_osm
  - title: "Helpers"
    desc: Paths, conversion to sf, and tag extraction.
    contents:
      - nyc_osm_path
      - nyc_osm_to_sf
      - nyc_osm_add_tags

navbar:
  right:
   - icon: fa-github
     href: https://github.com/kjhealy/nycosm
     aria-label: GitHub repository

figures:
  dev: grDevices::png
  dpi: 300
  dev.args: []
  fig.ext: png
  fig.width: 7.2916667
  fig.height: ~
  fig.retina: 2
  fig.asp: 1.618
