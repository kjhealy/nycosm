#
# GDAL OSM driver configuration for nycosm.
#
# Based on the default osmconf.ini shipped with GDAL. The attributes lists
# are the tags kept as columns in each layer; the complete tags of every
# element are added separately from DuckDB's ST_ReadOSM(), so other_tags is
# turned off.
#

# closed ways that are polygons
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,amenity,shop,cuisine,highway,public_transport,railway,leisure,tourism,natural,barrier,man_made,office,craft,healthcare,emergency,historic,place,brand,operator,opening_hours,website,phone,wheelchair,addr:housenumber,addr:street,addr:postcode,ref,wikidata
unsignificant=created_by,converted_by,source,time,ele,attribution
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,highway,service,footway,cycleway,surface,lanes,maxspeed,oneway,bridge,tunnel,layer,railway,waterway,barrier,access,bicycle,foot,ref,wikidata
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,building,building:levels,height,nycdoitt:bin,addr:housenumber,addr:street,addr:postcode,amenity,shop,leisure,landuse,natural,water,tourism,historic,sport,man_made,office,boundary,admin_level,aeroway,military,place,wikidata
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,route,ref,network,operator,colour,wikidata
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no
